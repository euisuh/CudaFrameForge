name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check helper scripts
        run: |
          bash -n run.sh
          python -m compileall -q utils
      - name: Check CUDA build recipe
        run: make -n build CXXFLAGS= LDFLAGS=
